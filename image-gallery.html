    <!-- Gallery Filtering Logic -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Wait a small bit to ensure any other initializations are complete
        setTimeout(function() {
            const galleryItems = document.querySelectorAll(".gallery-items > div");
            
            // 1. Dynamically assign data-category to each gallery item based on image src
            galleryItems.forEach(item => {
                const img = item.querySelector("img");
                if (!img) return;
                
                const src = img.getAttribute("src").toLowerCase();
                let category = "products"; // default category
                
                if (
                    src.includes("stamping-machine") || 
                    src.includes("4.18.52") || 
                    src.includes("4.18.53") || 
                    src.includes("4.18.54") || 
                    src.includes("4.18.55") ||
                    src.includes("9.47.27 am") ||
                    src.includes("9.47.28 am") ||
                    src.includes("9.47.29 am")
                ) {
                    category = "machinery";
                } else if (
                    src.includes("sheet-metal-factory") ||
                    src.includes("9.47.30 am") ||
                    src.includes("9.47.31 am") ||
                    src.includes("9.47.33 am") ||
                    src.includes("9.47.34 am") ||
                    src.includes("9.47.35 am")
                ) {
                    category = "plant";
                } else {
                    category = "products";
                }
                
                item.setAttribute("data-category", category);
            });

            // 2. Set up Magnific Popup dynamic updates
            function updateMagnificPopup(filterClass) {
                const $gallery = $('.gallery-items');
                if ($gallery.data('magnificPopup')) {
                    $gallery.data('magnificPopup').destroy();
                }
                
                $gallery.magnificPopup({
                    delegate: filterClass === 'all' ? 'a' : 'div:not(.gallery-item-hidden) a',
                    type: 'image',
                    closeOnContentClick: false,
                    closeBtnInside: false,
                    mainClass: 'mfp-with-zoom',
                    image: {
                        verticalFit: true,
                    },
                    gallery: {
                        enabled: true
                    },
                    zoom: {
                        enabled: true,
                        duration: 300,
                        opener: function(element) {
                            return element.find('img');
                        }
                    }
                });
            }

            // 3. Filter button click handler
            const filterButtons = document.querySelectorAll(".filter-btn");
            filterButtons.forEach(button => {
                button.addEventListener("click", function() {
                    filterButtons.forEach(btn => btn.classList.remove("active"));
                    this.classList.add("active");
                    
                    const filterValue = this.getAttribute("data-filter");
                    
                    galleryItems.forEach(item => {
                        const itemCategory = item.getAttribute("data-category");
                        
                        if (filterValue === "all" || itemCategory === filterValue) {
                            item.classList.remove("gallery-item-hidden");
                            
                            // Re-trigger WOW animation if WOW.js is loaded
                            const wowElement = item.querySelector('.wow');
                            if (wowElement && typeof WOW !== 'undefined') {
                                wowElement.style.visibility = 'visible';
                                wowElement.style.animationName = 'fadeInUp';
                            }
                        } else {
                            item.classList.add("gallery-item-hidden");
                        }
                    });
                    
                    updateMagnificPopup(filterValue);
                });
            });

            // Initial Magnific Popup setup
            updateMagnificPopup('all');
        }, 100);
    });
    </script>
